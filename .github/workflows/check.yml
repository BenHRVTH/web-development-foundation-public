name: M6 release candidate verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: M6 / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            timeout: 50
          - platform: Windows
            os: windows-latest
            timeout: 35
    steps:
      # Resolved from the upstream v4 refs on 2026-11-16; review SHA updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm install --global --ignore-scripts npm@11.9.0
      - run: npm ci --ignore-scripts
      - name: Install Linux browser and system dependencies
        if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps chromium
      - name: Install Windows browser
        if: runner.os == 'Windows'
        run: npx --no-install playwright install chromium
      # All original platform-specific checks/assertions remain in verify:m6.
      # The known R05 failure must fail this job; never mask it as a successful RC.
      - run: npm run verify:m6
      - name: Preserve this run's diagnostic evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wdf-verification-${{ matrix.platform }}-${{ github.event_name }}-${{ github.sha }}-${{ github.run_id }}
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}
          include-hidden-files: false
          if-no-files-found: warn
          path: |
            artifacts/packages/
            artifacts/consumer/
            artifacts/evidence/
            test-results/
            playwright-report/
            docs/reports/evidence/m6/
